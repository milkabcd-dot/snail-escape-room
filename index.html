<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבדת המחקר: סודות חלזונות השדה</title>
    <style>
        :root {
            --bg: #0b132b;
            --panel: rgba(28, 37, 65, 0.95);
            --border: rgba(91, 192, 190, 0.4);
            --primary: #5bc0be;
            --accent: #6fffe9;
            --alert: #ff0055;
            --success: #00f5d4;
            --text-main: #ffffff;
            --text-sub: #d8f3dc;
            --info-bg: #1c2541;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0b132b;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(111, 255, 233, 0.4);
        }

        .credit {
            display: inline-block;
            background: rgba(91, 192, 190, 0.2);
            border: 1px solid var(--primary);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.05rem;
        }

        .main-card {
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .progress-stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }

        .progress-stepper::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 4px;
            background: rgba(255,255,255,0.15);
            z-index: 1;
        }

        .step {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: #0b132b;
            border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem;
            z-index: 2;
            color: #fff;
        }

        .step.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .step.done {
            background: var(--success);
            border-color: var(--success);
            color: #000;
        }

        .station { display: none; }
        .station.active { display: block; }

        .clue-box {
            background: rgba(0,0,0,0.4);
            border-right: 4px solid var(--primary);
            padding: 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .help-btn {
            background: rgba(255, 230, 0, 0.15);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 0 auto 20px auto;
        }

        .help-btn:hover {
            background: #ffe600;
            color: #000;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--info-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            color: var(--accent);
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .modal-content {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f5f9;
            margin-bottom: 20px;
        }

        .modal-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            border: 2px solid var(--accent);
            margin: 15px 0;
            display: block;
        }

        .close-modal-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        .rotary-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
        }

        .wheel-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            color: #000;
