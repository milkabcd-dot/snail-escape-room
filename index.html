<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבדת המחקר: סודות חלזונות השדה</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap');

        :root {
            --bg: #0b132b;
            --panel: rgba(28, 37, 65, 0.85);
            --border: rgba(91, 192, 190, 0.4);
            --primary: #5bc0be;
            --accent: #6fffe9;
            --alert: #ff0055;
            --success: #00f5d4;
            --text-main: #ffffff;
            --text-sub: #d8f3dc;
            --info-bg: #1c2541;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
            background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .bg-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.4rem;
            margin: 0;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(111, 255, 233, 0.3);
        }

        .credit {
            display: inline-block;
            margin-top: 10px;
            background: rgba(91, 192, 190, 0.15);
            border: 1px solid var(--primary);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 600;
            color: var(--accent);
        }

        .main-card {
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .progress-stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }

        .progress-stepper::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 1;
        }

        .step {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #0b132b;
            border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.2rem;
            z-index: 2;
            transition: all 0.4s ease;
        }

        .step.active {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .step.done {
            background: var(--success);
            border-color: var(--success);
            color: #000;
        }

        .station { display: none; }
        .station.active { display: block; animation: zoomIn 0.4s ease; }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .clue-box {
            background: rgba(0,0,0,0.4);
            border-right: 4px solid var(--primary);
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* --- כפתור חלון עזרה --- */
        .help-btn {
            background: rgba(255, 230, 0, 0.15);
            border: 2px solid #ffe600;
            color: #ffe600;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto 20px auto;
            transition: all 0.2s ease;
        }

        .help-btn:hover {
            background: #ffe600;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
        }

        /* --- Modal (חלון צץ לעזרה) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--info-bg);
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 30px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-title {
            color: var(--accent);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .modal-content {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #f1f5f9;
            margin-bottom: 20px;
        }

        .close-modal-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            display: block;
            margin: 0 auto;
        }

        /* --- Lock 1: Rotary Lock --- */
        .rotary-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 25px 0;
        }

        .wheel-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-btn {
            background: var(--primary);
            color: #000;
            border: none;
            width: 70px; height: 35px;
            border-radius: 8px;
            font-weight: bold; font-size: 1.3rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .wheel-btn:hover { background: var(--accent); }

        .wheel-val {
            font-size: 2.8rem;
            font-weight: 800;
            width: 75px; height: 85px;
            background: #000;
            border: 3px solid var(--accent);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin: 10px 0;
            color: var(--accent);
            cursor: pointer;
            user-select: none;
        }

        /* --- Lock 2: Keypad --- */
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }

        .key-btn {
            width: 70px; height: 60px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff; font-size: 1.4rem; font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .key-btn:hover { background: var(--primary); color: #000; }

        .keypad-display {
            width: 234px; height: 50px;
            background: #000;
            border: 2px solid var(--accent);
            margin: 0 auto 15px auto;
            border-radius: 8px;
            font-size: 1.8rem; letter-spacing: 8px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
        }

        .order-list {
            display: flex; flex-direction: column; gap: 12px; margin: 2
